<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<style>
:root{--ink:#17203b;--muted:#687089;--paper:#fbf7f1;--card:#fff;--blue:#2577e8;--green:#2fa768;--peach:#ffeadc;--lav:#eee9ff;--line:#e7e2dd;--bad:#c64e4e;--good:#188653;--shadow:0 18px 60px rgba(49,47,66,.12);font-family:-apple-system,BlinkMacSystemFont,"Avenir Next","Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7fbff 0,#fff8f1 56%,#f7f2ec 100%);color:var(--ink);min-height:100dvh;-webkit-tap-highlight-color:transparent}button,input{font:inherit}button{border:0;cursor:pointer}.app{min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));max-width:620px;margin:auto}.top{height:50px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:850;letter-spacing:-.02em}.round{width:42px;height:42px;border-radius:50%;background:#ffffffcc;border:1px solid var(--line);font-size:22px}.screen{animation:in .2s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}h1{font-size:clamp(42px,12vw,64px);line-height:.98;letter-spacing:-.055em;margin:18px 0 12px}h2{font-size:28px;letter-spacing:-.035em;margin:8px 0}.script{font-family:Georgia,serif;font-style:italic;color:#e2604d}.sub{color:var(--muted);line-height:1.5}.heroArt{height:245px;border-radius:30px;overflow:hidden;position:relative;background:linear-gradient(#bde4ff 0 43%,#d6d7a9 44% 55%,#deb07d 56%);box-shadow:var(--shadow);margin:24px 0}.sun{position:absolute;width:72px;height:72px;border-radius:50%;background:#ffd55b;right:34px;top:30px}.mount{position:absolute;left:-8%;right:-8%;height:150px;bottom:65px;background:#7893b9;clip-path:polygon(0 100%,18% 51%,28% 72%,48% 24%,60% 66%,76% 38%,100% 100%)}.village{position:absolute;inset:auto 0 0;height:95px;background:linear-gradient(15deg,#c97e56 0 20%,#f4d6a9 20% 32%,#b85e48 32% 45%,#f5dfbc 45% 100%);clip-path:polygon(0 35%,10% 28%,17% 50%,29% 24%,39% 44%,52% 14%,64% 47%,75% 26%,88% 50%,100% 22%,100% 100%,0 100%)}.llama{position:absolute;left:28px;bottom:25px;font-size:74px;filter:drop-shadow(0 8px 8px #0002)}.sign{position:absolute;right:22px;bottom:26px;background:#f1c688;border:3px solid #8b5b36;border-radius:8px;padding:9px 14px;font:700 19px Georgia;transform:rotate(-3deg)}.cta{width:100%;min-height:58px;border-radius:18px;background:linear-gradient(135deg,#2582ef,#1f68d6);color:white;font-weight:800;font-size:18px;box-shadow:0 8px 22px #2577e83d}.cta.green{background:linear-gradient(135deg,#38ba75,#23935a)}.ghost{width:100%;min-height:52px;border-radius:16px;background:white;border:1px solid var(--line);font-weight:750;color:var(--ink)}.grid{display:grid;gap:12px}.mode{background:white;border:1px solid var(--line);border-radius:22px;padding:18px;text-align:left;box-shadow:0 8px 25px #0000000a;display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:14px}.mode .ico{width:52px;height:52px;border-radius:15px;background:#dfeeff;display:grid;place-items:center;font-size:28px}.mode:nth-child(2) .ico{background:#e0f4e6}.mode strong{font-size:20px;display:block}.mode small{color:var(--muted);line-height:1.35;display:block;margin-top:4px}.chev{font-size:28px}.section{margin:22px 0 10px;font-weight:850}.cats{display:grid;gap:9px}.cat{display:flex;align-items:center;gap:11px;background:white;border:1px solid var(--line);border-radius:15px;padding:13px}.cat input{width:20px;height:20px;accent-color:var(--blue)}.cat b{flex:1}.cat small{color:var(--muted)}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.seg button{background:white;border:1px solid var(--line);border-radius:13px;padding:12px 4px;font-weight:750}.seg button.on{background:var(--lav);border-color:#9c85e8;color:#4c37a5}
</style><style>
.studyHead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 18px}.progress{font-size:14px;color:var(--muted);font-weight:700}.bar{height:8px;background:#ece8e3;border-radius:99px;overflow:hidden;margin:0 0 22px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2b82ed,#54b7ff);width:0}.flash{min-height:390px;background:#fff;border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);padding:34px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.prompt{font-size:14px;color:#4d78b5;margin-bottom:22px}.word{font-size:clamp(38px,12vw,56px);font-weight:850;letter-spacing:-.045em}.spanish{font-family:Georgia,serif;font-size:clamp(38px,12vw,55px);font-weight:700}.forms{font-family:Georgia,serif;font-size:clamp(28px,9vw,42px);font-weight:700;line-height:1.25}.tap{margin-top:30px;color:var(--muted);font-size:14px}.speaker{width:64px;height:64px;border-radius:50%;background:#2580ed;color:#fff;font-size:28px;margin:24px 0 4px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.controls.three{grid-template-columns:1fr 1fr 1fr}.goodbtn{background:#e2f5e9;color:#176c45;border:1px solid #b6dec7}.again{background:#fff0e8;color:#9d5038;border:1px solid #f0c6b7}.control{min-height:52px;border-radius:15px;font-weight:800}.quizCard{background:#fff;border:1px solid var(--line);border-radius:28px;padding:27px 20px;box-shadow:var(--shadow);text-align:center}.quizCard .word{margin:18px 0 28px}.answer{width:100%;height:58px;border:2px solid #cfd8e6;border-radius:15px;padding:0 15px;font-size:20px;outline:none}.answer:focus{border-color:#2b82ed;box-shadow:0 0 0 4px #2b82ed1c}.accents{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:11px 0}.accent{min-width:38px;height:38px;border-radius:10px;background:#f1f5fb;color:#27446f;font-weight:800}.feedback{border-radius:17px;padding:15px;margin:13px 0;text-align:left}.feedback.ok{background:#e5f7eb;color:#176c45}.feedback.no{background:#fff0ed;color:#9d3d3d}.feedback b{display:block;font-size:18px}.result{text-align:center;background:white;border:1px solid var(--line);border-radius:30px;padding:34px 22px;box-shadow:var(--shadow)}.score{font-size:70px;font-weight:900;letter-spacing:-.07em;color:#2e7fe2;margin:20px 0 6px}.tiny{font-size:12px;color:var(--muted)}.note{font-size:13px;color:var(--muted);line-height:1.45;margin-top:12px}.footer{padding:24px 0 8px;text-align:center;color:#8790a0;font-size:11px}.hide{display:none!important}@media(max-width:380px){.app{padding-left:12px;padding-right:12px}.heroArt{height:218px}.flash{min-height:350px}.mode{padding:14px}.mode strong{font-size:18px}}
</style></head><body><div class="app"><div class="top"><div class="brand">Alaina’s Study Club ✦</div><button id="close" class="round hide" aria-label="Close practice">×</button></div><main id="main"></main><div class="footer">Made just for Alaina · Unit 1 practice</div></div>
<script>
const CATS=[['numbers','Numbers','Los números'],['personal','Personal information','Los datos personales'],['greetings','Greetings','Los saludos'],['courtesy','Courtesy & titles','La cortesía y los títulos'],['occupations','Occupations','Las ocupaciones'],['nationalities','Nationalities','Las nacionalidades'],['languages','Languages','Los idiomas']];
let cards=[];const add=(cat,en,...forms)=>cards.push({cat,en,forms});
const one=['uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve','treinta'];
const eng=['one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty','twenty-one','twenty-two','twenty-three','twenty-four','twenty-five','twenty-six','twenty-seven','twenty-eight','twenty-nine','thirty'];
eng.forEach((e,i)=>add('numbers',e,one[i]));const tens={3:'treinta',4:'cuarenta'};const ones=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve'];for(let n=31;n<=49;n++){let t=Math.floor(n/10),o=n%10;add('numbers',`${['','','','thirty','forty'][t]}-${['','one','two','three','four','five','six','seven','eight','nine'][o]}`,`${tens[t]} y ${ones[o]}`)}
[['fifty','cincuenta'],['sixty','sesenta'],['seventy','setenta'],['eighty','ochenta'],['ninety','noventa'],['one hundred','cien']].forEach(x=>add('numbers',...x));
[['name','el nombre'],['age','la edad'],['country','el país'],['occupation','la ocupación'],['email','el correo electrónico'],['telephone number','el número de teléfono'],['birthday','el cumpleaños']].forEach(x=>add('personal',...x));
[['to greet','saludar'],['to kiss','dar un beso'],['to shake hands','dar un apretón de manos'],['to hug','dar un abrazo']].forEach(x=>add('greetings',...x));
[['Nice to meet you','encantado','encantada'],['Mr. Rodríguez','el señor Rodríguez'],['Mrs. Martínez','la señora Martínez'],['Miss Rivera','la señorita Rivera'],['Mrs. Ana and Mr. Roberto','doña Ana y don Roberto']].forEach(x=>add('courtesy',...x));
</script><script>
[['actor / actress','el actor','la actriz'],['astronaut','el astronauta','la astronauta'],['singer','el cantante','la cantante'],['chef','el cocinero','la cocinera'],['athlete','el deportista','la deportista'],['director','el director','la directora'],['doctor','el doctor','la doctora'],['writer','el escritor','la escritora'],['student','el estudiante','la estudiante'],['photographer','el fotógrafo','la fotógrafa'],['judge','el juez','la jueza'],['journalist','el periodista','la periodista'],['teacher','el profesor','la profesora']].forEach(x=>add('occupations',...x));
const nat=[['Spanish','español','española'],['Equatorial Guinean','guineano','guineana'],['Cuban','cubano','cubana'],['Dominican','dominicano','dominicana'],['Puerto Rican','puertorriqueño','puertorriqueña'],['Canadian','canadiense'],['American','estadounidense'],['Mexican','mexicano','mexicana'],['Costa Rican','costarricense'],['Guatemalan','guatemalteco','guatemalteca'],['Honduran','hondureño','hondureña'],['Nicaraguan','nicaragüense'],['Panamanian','panameño','panameña'],['Salvadoran','salvadoreño','salvadoreña'],['Argentinian','argentino','argentina'],['Bolivian','boliviano','boliviana'],['Chilean','chileno','chilena'],['Colombian','colombiano','colombiana'],['Ecuadorian','ecuatoriano','ecuatoriana'],['Peruvian','peruano','peruana'],['Paraguayan','paraguayo','paraguaya'],['Uruguayan','uruguayo','uruguaya'],['Venezuelan','venezolano','venezolana'],['German','alemán','alemana'],['Australian','australiano','australiana'],['Brazilian','brasileño','brasileña'],['British','británico','británica'],['Chinese','chino','china'],['French','francés','francesa'],['Irish','irlandés','irlandesa'],['Italian','italiano','italiana'],['Japanese','japonés','japonesa'],['Nigerian','nigeriano','nigeriana'],['Polish','polaco','polaca'],['Russian','ruso','rusa']];nat.forEach(x=>add('nationalities',...x));
const langs=[['German','el alemán'],['Arabic','el árabe'],['Aymara','el aymara','el aimara'],['Chinese','el chino'],['Korean','el coreano'],['Catalan','el catalán'],['Spanish','el español'],['French','el francés'],['Galician','el gallego'],['Greek','el griego'],['Guaraní','el guaraní'],['Hindi','el hindi'],['Hebrew','el hebreo'],['Dutch','el holandés'],['English','el inglés'],['Italian','el italiano'],['Japanese','el japonés'],['Lakota','el lakota'],['Nahuatl','el náhuatl'],['Navajo','el navajo'],['Polish','el polaco'],['Portuguese','el portugués'],['Quechua','el quechua'],['Russian','el ruso'],['Tagalog','el tagalo'],['Thai','el tailandés'],['Vietnamese','el vietnamita'],['Basque','el vasco']];langs.forEach(x=>add('languages',x[0]+' (language)',...x.slice(1)));
const TOTAL=cards.length;let state={screen:'home',mode:'flash',selected:new Set(CATS.map(c=>c[0])),length:10,deck:[],i:0,flipped:false,score:0,answers:[],checked:false};const main=document.getElementById('main'),closeBtn=document.getElementById('close');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function showClose(v=true){closeBtn.classList.toggle('hide',!v)}
function home(){state.screen='home';showClose(false);main.innerHTML=`<section class="screen"><div class="tiny">REPORTEROS 1 · UNIT 1</div><h1>Alaina’s<br><span class="script">Spanish Quiz</span><br>Practice</h1><p class="sub">A little practice. A little confidence. You’ve got this.</p><div class="heroArt" aria-label="A cheerful mountain village illustration"><div class="sun"></div><div class="mount"></div><div class="village"></div><div class="llama">🦙</div><div class="sign">¡Tú puedes! ♡</div></div><button class="cta" onclick="menu()">Press Start →</button><p class="note" style="text-align:center">${TOTAL} carefully entered vocabulary cards · shuffled every round</p></section>`}
function menu(){state.screen='menu';showClose(true);main.innerHTML=`<section class="screen"><h2>Choose a practice mode</h2><p class="sub">Start with flashcards, or test the exact Spanish spelling.</p><div class="grid"><button class="mode" onclick="setup('flash')"><span class="ico">▣</span><span><strong>Flashcards</strong><small>See English, tap to reveal Spanish, then hear it aloud.</small></span><span class="chev">›</span></button><button class="mode" onclick="setup('quiz')"><span class="ico">✎</span><span><strong>Spelling Quiz</strong><small>Type the Spanish word and check your answer.</small></span><span class="chev">›</span></button></div></section>`}
function setup(mode){state.mode=mode;state.screen='setup';showClose(true);renderSetup()}
</script><script>
function renderSetup(){let rows=CATS.map(c=>{let count=cards.filter(x=>x.cat===c[0]).length;return `<label class="cat"><input type="checkbox" ${state.selected.has(c[0])?'checked':''} onchange="toggleCat('${c[0]}',this.checked)"><b>${esc(c[1])}<small style="display:block">${esc(c[2])}</small></b><small>${count}</small></label>`}).join('');main.innerHTML=`<section class="screen"><h2>${state.mode==='flash'?'Flashcards':'Spelling Quiz'}</h2><p class="sub">Choose what Alaina wants to practice today.</p><div class="section">Topics</div><div class="cats">${rows}</div><div class="section">Round length</div><div class="seg"><button class="${state.length===10?'on':''}" onclick="setLen(10)">10</button><button class="${state.length===20?'on':''}" onclick="setLen(20)">20</button><button class="${state.length===999?'on':''}" onclick="setLen(999)">All</button></div><div style="height:18px"></div><button class="cta ${state.mode==='quiz'?'green':''}" onclick="startRound()">Start ${state.mode==='flash'?'Flashcards':'Quiz'} →</button><p class="note">No timer. Each round is randomized, so repeated practice comes in a different order.</p></section>`}
function toggleCat(id,on){on?state.selected.add(id):state.selected.delete(id)}function setLen(n){state.length=n;renderSetup()}
function startRound(){let pool=cards.filter(c=>state.selected.has(c.cat));if(!pool.length){alert('Choose at least one topic first.');return}state.deck=shuffle(pool).slice(0,Math.min(state.length,pool.length));state.i=0;state.score=0;state.answers=[];state.flipped=false;state.checked=false;state.screen='study';renderCard()}
function catName(id){return CATS.find(c=>c[0]===id)?.[1]||id}function progress(){return Math.round((state.i/state.deck.length)*100)}
function renderCard(){if(state.i>=state.deck.length)return results();showClose(true);let c=state.deck[state.i],p=Math.round(((state.i)/state.deck.length)*100);if(state.mode==='flash')renderFlash(c,p);else renderQuiz(c,p)}
function renderFlash(c,p){main.innerHTML=`<section class="screen"><div class="studyHead"><button class="round" onclick="menu()">‹</button><div class="progress">${state.i+1} / ${state.deck.length} · ${esc(catName(c.cat))}</div></div><div class="bar"><i style="width:${p}%"></i></div><div class="flash" role="button" tabindex="0" onclick="flip()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flip()}" aria-label="Flashcard. Tap to flip.">${state.flipped?`<div class="prompt">In Spanish</div><div class="forms">${c.forms.map(esc).join('<br><span class="tiny">or</span><br>')}</div><button class="speaker" onclick="event.stopPropagation();speak('${esc(c.forms[0]).replace(/'/g,"\\'")}')" aria-label="Hear Spanish pronunciation">🔊</button><div class="tap">Tap the speaker to hear it</div>`:`<div class="prompt">What’s this in Spanish?</div><div class="word">${esc(c.en)}</div><div class="tap">Tap to flip ↗</div>`}</div>${state.flipped?`<div class="controls"><button class="control again" onclick="rate(false)">Practice again</button><button class="control goodbtn" onclick="rate(true)">Got it ✓</button></div>`:`<div class="controls"><button class="control ghost" onclick="skipFlash()">Skip</button><button class="control cta" onclick="flip()">Flip Card</button></div>`}</section>`}
function flip(){state.flipped=true;renderCard()}function rate(ok){if(ok)state.score++;state.answers.push({c:state.deck[state.i],ok});state.i++;state.flipped=false;renderCard()}function skipFlash(){state.answers.push({c:state.deck[state.i],ok:false});state.i++;state.flipped=false;renderCard()}
function renderQuiz(c,p){main.innerHTML=`<section class="screen"><div class="studyHead"><button class="round" onclick="menu()">‹</button><div class="progress">${state.i+1} / ${state.deck.length} · ${esc(catName(c.cat))}</div></div><div class="bar"><i style="width:${p}%"></i></div><div class="quizCard"><div class="prompt">Write the Spanish for:</div><div class="word">${esc(c.en)}</div><form onsubmit="event.preventDefault();${state.checked?'nextQuiz()':'checkQuiz()'}"><input id="ans" class="answer" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Type your answer…" ${state.checked?'disabled':''}><div class="accents">${['á','é','í','ó','ú','ü','ñ'].map(x=>`<button type="button" class="accent" onclick="accent('${x}')">${x}</button>`).join('')}</div><div id="fb"></div><button class="cta ${state.checked?'':'green'}" type="submit">${state.checked?'Next Question →':'Check Answer'}</button></form></div><button class="ghost" style="margin-top:11px" onclick="quizSkip()">${state.checked?'':'Skip this word'}</button></section>`;if(!state.checked)setTimeout(()=>document.getElementById('ans')?.focus(),100)}
</script><script>
function canon(s){return s.trim().toLowerCase().replace(/[.!?¡¿]+$/g,'').replace(/\s+/g,' ')}function noAccent(s){return canon(s).replace(/ñ/g,'§').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/§/g,'ñ')}
function accepted(c){let out=[];for(const f of c.forms){out.push(canon(f));out.push(canon(f).replace(/^(el|la)\s+/,''))}return [...new Set(out)]}
function checkQuiz(){let c=state.deck[state.i],input=document.getElementById('ans'),raw=input.value,ans=canon(raw),valid=accepted(c),ok=valid.includes(ans),near=!ok&&valid.some(v=>noAccent(v)===noAccent(ans));state.checked=true;if(ok)state.score++;state.answers.push({c,ok,raw});input.disabled=true;let fb=document.getElementById('fb');fb.className='feedback '+(ok?'ok':'no');fb.innerHTML=ok?`<b>✓ ¡Correcto!</b><span>${esc(c.forms[0])}</span>`:`<b>${near?'Almost — watch the accents.':'Not quite yet.'}</b><span>Answer: ${c.forms.map(esc).join(' / ')}</span><br><button type="button" class="soft" onclick="speak('${esc(c.forms[0]).replace(/'/g,"\\'")}')">🔊 Hear it</button>`;document.querySelector('.quizCard .cta').textContent='Next Question →'}
function nextQuiz(){state.i++;state.checked=false;renderCard()}function quizSkip(){if(state.checked)return nextQuiz();let c=state.deck[state.i];state.answers.push({c,ok:false,raw:''});state.checked=true;let fb=document.getElementById('fb');fb.className='feedback no';fb.innerHTML=`<b>Skipped — here it is.</b><span>${c.forms.map(esc).join(' / ')}</span>`;document.getElementById('ans').disabled=true;document.querySelector('.quizCard .cta').textContent='Next Question →'}
function accent(ch){let i=document.getElementById('ans');if(!i||i.disabled)return;let a=i.selectionStart??i.value.length,b=i.selectionEnd??a;i.setRangeText(ch,a,b,'end');i.focus()}
function speak(text){if(!('speechSynthesis'in window))return alert('Speech is not available in this browser.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);let vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('es'));u.voice=vs.find(v=>/mx|us/i.test(v.lang))||vs[0]||null;u.lang=u.voice?.lang||'es-MX';u.rate=.82;speechSynthesis.speak(u)}
function results(){state.screen='result';let missed=state.answers.filter(a=>!a.ok);let pct=Math.round(state.score/state.deck.length*100);showClose(true);main.innerHTML=`<section class="screen result"><div style="font-size:50px">${pct===100?'🎉':pct>=80?'🌟':'🌱'}</div><h2>${pct===100?'Amazing, Alaina!':pct>=80?'Great work, Alaina!':'Keep going, Alaina!'}</h2><div class="score">${state.score}/${state.deck.length}</div><p class="sub">${state.mode==='quiz'?'correct spellings':'cards marked “Got it”'}</p>${missed.length?`<div class="feedback no" style="text-align:left"><b>${missed.length} to practice again</b>${missed.slice(0,8).map(a=>`<div style="margin-top:8px">${esc(a.c.en)} → <strong>${esc(a.c.forms[0])}</strong></div>`).join('')}${missed.length>8?`<div class="tiny" style="margin-top:8px">+ ${missed.length-8} more</div>`:''}</div>`:`<div class="feedback ok"><b>Perfect round ✓</b>You got every one.</div>`}<div class="grid" style="margin-top:18px"><button class="cta" onclick="repeat()">Practice Again ↻</button><button class="ghost" onclick="menu()">Choose Another Mode</button></div></section>`}
function repeat(){let old=[...state.deck];state.deck=shuffle(old);state.i=0;state.score=0;state.answers=[];state.flipped=false;state.checked=false;state.screen='study';renderCard()}
closeBtn.onclick=()=>{if(state.screen==='study'&&state.i>0&&!confirm('Leave this practice round?'))return;home()};window.addEventListener('pagehide',()=>speechSynthesis?.cancel());
if(TOTAL!==147)console.error('Vocabulary count mismatch',TOTAL);home();
</script></body></html>
