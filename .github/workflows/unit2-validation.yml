name: Unit 2 validation
on:
  push:
    branches: [feature/unit-2-20260909]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Package current source for isolated validation
        run: git archive --format=zip HEAD > app-source.zip
      - uses: actions/upload-artifact@v5
        with:
          name: unit2-source
          path: app-source.zip
          retention-days: 7
