    <button type="button" class="secondary listen-play" id="listen-play" data-action="listen-play" aria-describedby="listen-status">${icon('sound')} Play Spanish</button>
    <p id="listen-status" class="listen-status" role="status" aria-live="polite">One first listen + 3 replays.</p>
    <p id="listen-error" class="listen-error" role="status" hidden></p></div>`;
}
function updateListeningControls() {
  const q=session?.listening, play=document.getElementById('listen-play');
  if (!q || !play || view !== 'practice' || session.checked) return;
  const remaining=Math.max(0,LISTEN_LIMIT-q.plays);
  play.disabled=q.busy || remaining===0;
  play.innerHTML=icon('sound')+' '+(q.busy?'Playing Spanish…':!q.plays?'Play Spanish':remaining?`Play again (${remaining} left)`:'No replays left');
  document.getElementById('listen-status').textContent=q.busy?'Listen carefully.':!q.plays?'One first listen + 3 replays.':remaining?`${remaining} ${remaining===1?'replay':'replays'} left for this question.`:'All 4 listens used. Now spell what you heard.';
  const message=document.getElementById('listen-error'); message.textContent=q.message; message.hidden=!q.message;
  document.getElementById('quiz-submit').disabled=q.busy || !q.plays;
}
function playListeningQuestion() {
  const q=session?.listening;
  if (view!=='practice' || session?.mode!=='listening' || session.checked || !q || q.busy || q.plays>=LISTEN_LIMIT) return;
  q.busy=true; q.message=''; updateListeningControls();
  let settled=false, startTimer=null, endTimer=null;
  const finish=(success,message='')=>{
    if (settled) return; settled=true;
    clearTimeout(startTimer); clearTimeout(endTimer);
    if (cancelListeningAttempt===cancel) cancelListeningAttempt=null;
    q.busy=false;
    if (session?.listening!==q || session.checked || view!=='practice') return;
    if (success) q.plays++;
    q.message=message; updateListeningControls();
  };
  const cancel=()=>finish(false,'Audio paused. Tap Play Spanish to try again. This listen was not used.');
  const failed=()=>finish(false,'Audio did not finish. Check your volume or Spanish voice in Settings, then tap Play Spanish. This listen was not used.');
  const timedOut=()=>{failed(); stopSpeech();};
  startTimer=setTimeout(timedOut,6000);
  speak(q.form,{
    onStart:()=>{if(settled)return;clearTimeout(startTimer);endTimer=setTimeout(timedOut,30000);},
    onEnd:()=>finish(true),
    onFailure:failed
  });
  if (!settled) cancelListeningAttempt=cancel;
}
function heardAudioHTML(card) {
  const q=session.listening;
  return `<div class="audio-group"><button class="audio-button" type="button" data-action="speak" data-card="${e(card.id)}" data-form="${q.formIndex}" aria-label="Listen to the answer again">${icon('sound')} Listen to the answer</button></div>`;
}


function save() {
  try { localStorage.setItem(STORE,JSON.stringify({settings,progress})); storageAvailable=true; }
  catch (_) { storageAvailable=false; }
}
function toast(message) {
  const box=document.getElementById('toast');
  box.textContent=message; box.hidden=false;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{box.hidden=true;},6000);
}
function announce(message) { document.getElementById('announcer').textContent=message; }
function stopSpeech() {
  if(cancelListeningAttempt){const cancel=cancelListeningAttempt;cancelListeningAttempt=null;cancel();}
  speechSerial++;
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  activeUtterance=null;
}
function spanishVoices() {
  try { return window.speechSynthesis?.getVoices().filter(v=>/^es(?:[-_]|$)/i.test(v.lang)) || []; }
  catch (_) { return []; }
}
function speak(text, hooks={}) {
  if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
    toast('Spanish audio is not available in this browser. Try Safari, Chrome, or Edge.'); hooks.onFailure?.(); return;
  }
  stopSpeech();
  const serial=speechSerial;
  const voices=spanishVoices();
  const selected=voices.find(v=>v.voiceURI===settings.voice)
    ||voices.find(v=>/^es[-_]MX$/i.test(v.lang))
    ||voices.find(v=>/^es[-_]US$/i.test(v.lang))
    ||voices.find(v=>!/^es[-_]ES$/i.test(v.lang))||voices[0];
  if (!selected && window.speechSynthesis.getVoices().length) {
    toast('This browser has no Spanish voice installed. Add a Spanish voice in your device’s speech settings, then reopen the app.'); hooks.onFailure?.(); return;
  }
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang=selected?.lang || 'es-MX';
  if (selected) utterance.voice=selected;
  utterance.rate=Number(settings.speed); utterance.pitch=1; utterance.volume=1;
  utterance.onstart=()=>{if(serial===speechSerial){announce('Playing Spanish pronunciation.');hooks.onStart?.();}};
  utterance.onend=()=>{if(serial===speechSerial){activeUtterance=null;announce('Pronunciation finished.');hooks.onEnd?.();}};
  utterance.onerror=(event)=>{
    if (serial!==speechSerial) return;
    activeUtterance=null;
    // An OS audio interruption must unlock listening controls immediately.
    if (['canceled','interrupted'].includes(event.error)) { hooks.onFailure?.(); return; }
    toast('Audio did not play. Check your volume and Spanish voice in Settings, or try opening the app in your browser.');hooks.onFailure?.();
  };
  activeUtterance=utterance; // Keep the utterance alive on WebKit.
  try { window.speechSynthesis.resume(); window.speechSynthesis.speak(utterance); }
  catch (_) { toast('Audio could not start. Try the pronunciation test in Settings.');hooks.onFailure?.(); }
}

function record(card, correct, kind) {
  const old=progress.items[card.id]||{};
  progress.items[card.id]={...old,seen:(Number(old.seen)||0)+1,needsReview:!correct,
    quizCorrect:(Number(old.quizCorrect)||0)+(isSpellingMode(kind)&&correct?1:0),
    listeningCorrect:(Number(old.listeningCorrect)||0)+(kind==='listening'&&correct?1:0),
    listeningAttempts:(Number(old.listeningAttempts)||0)+(kind==='listening'?1:0)};
  save();
}

function eligibleCards() {return CARDS.filter(card=>settings.categories.includes(card.category)&&(!onlyReview||progress.items[card.id]?.needsReview));}
function updateSetupCount() {

  button.innerHTML=`Start ${amount} ${isSpellingMode(settings.mode)?(amount===1?'question':'questions'):(amount===1?'flashcard':'flashcards')} ${icon('arrow')}`;
  button.disabled=!amount;
  document.getElementById('setup-error').textContent=pool.length?'':onlyReview?'No tricky words in these topics yet. Turn off “Just my tricky words” or choose other topics.':'Choose at least one topic to begin.';

function beginRound(overridePool=null, overrideMode=null, retry=false) {
  const pool=overridePool||eligibleCards();

  stopSpeech();
  const cards=makeRound(pool,retry?'all':settings.length,lastOrder);
  lastOrder=cards.map(c=>c.id);
  session={mode:overrideMode||settings.mode,cards,index:0,responses:[],revealed:false,checked:false,feedback:null,input:'',originalPool:[...pool],retry};

function renderPractice() {

function flashHTML(card) {
  return `<button id="flip-card" class="flash-card" data-action="flip" aria-label="${e(card.en)}. Reveal the Spanish translation" aria-pressed="false"><span class="flip-inner"><span class="card-face front" id="flash-front"><span class="card-language">IN ENGLISH</span><span class="card-word ${card.en.length>22?'long':''}">${e(card.en)}</span>${card.number?`<span class="number-caption">${card.number}</span>`:''}<span class="tap-hint">${icon('flip')} Tap to see the Spanish</span></span><span class="card-face back" id="flash-back" aria-hidden="true"><span class="card-language">IN SPANISH</span><span class="card-forms">${card.forms.map((f,i)=>`${i?'<span class="card-form-join">or</span>':''}<span lang="es" class="card-word es ${f.length>24?'very-long':f.length>17?'long':''}">${e(f)}</span>`).join('')}</span><span class="tap-hint">${icon('flip')} Tap to see the English</span></span></span></button>
    <div class="flash-under"><div id="before-flip" class="before-flip">Try saying it out loud. It’s okay to take a guess.</div><div id="after-flip" hidden>${audioGroup(card)}${card.note?`<p class="study-note">${e(card.note)}</p>`:''}</div></div>
    <div class="rate-actions"><button class="secondary" data-action="rate" data-correct="false" disabled>${icon('repeat')} Practice again</button><button class="got-it" data-action="rate" data-correct="true" disabled>Got it ${icon('check')}</button></div><div class="practice-bottom"><button class="text-button" data-action="flash-skip">Skip this card for now</button></div>`;
}
function flipCard() {
  if(!session||session.mode!=='flashcards')return;
  session.revealed=!session.revealed;
  const revealed=session.revealed;
  const card=session.cards[session.index];
  const button=document.getElementById('flip-card');
  button.classList.toggle('flipped',revealed);
  button.setAttribute('aria-pressed',String(revealed));
  button.setAttribute('aria-label',revealed?'Spanish: '+card.forms.join(' or ')+'. Show the English again':card.en+'. Reveal the Spanish translation');
  document.getElementById('flash-front').setAttribute('aria-hidden',String(revealed));
  document.getElementById('flash-back').setAttribute('aria-hidden',String(!revealed));
  document.getElementById('before-flip').hidden=revealed;
  document.getElementById('after-flip').hidden=!revealed;
  document.querySelectorAll('[data-action="rate"]').forEach(b=>b.disabled=!revealed);
  if(!revealed)stopSpeech();
  announce(revealed?'Spanish: '+card.forms.join(' or '):'English: '+card.en);
}
function rateCard(correct, skipped=false) {
  if(!session||session.mode!=='flashcards'||(!session.revealed&&!skipped))return;
  const card=session.cards[session.index];
  session.responses.push({id:card.id,correct,status:skipped?'skipped':correct?'correct':'review',input:''});
  record(card,correct,'flashcards');
  nextCard();
}
function quizHTML(card) {
  return `<form id="quiz-form" novalidate><div class="quiz-card">${session.mode==='listening'?listeningPromptHTML():`<div class="quiz-prompt"><span class="card-language">HOW DO YOU WRITE THIS IN SPANISH?</span><div class="card-word ${card.en.length>24?'long':''}">${e(card.en)}</div>${card.number?`<div class="number-caption">${card.number}</div>`:''}</div>`}

    <div class="accent-keys" aria-label="Spanish accent letters">${['á','é','í','ó','ú','ü','ñ'].map(letter=>`<button type="button" class="accent-key" data-action="accent" data-letter="${letter}" aria-label="Insert ${letter}">${letter}</button>`).join('')}</div><p class="answer-hint" id="answer-hint">${session.mode==='listening'?'Spell the exact word or phrase you heard, including accents, ñ, and ü. El / la is optional.':'Use a word or phrase from your worksheet. Write one form, not both. Accents, ñ, and ü count; el / la is optional.'}</p><div id="answer-error" class="error-inline" role="status"></div><div id="quiz-feedback" aria-live="polite" aria-atomic="true"></div><button class="primary quiz-submit" id="quiz-submit" type="button" data-action="quiz-submit">Check my answer ${icon('check')}</button></div><div class="quiz-skip"><button type="button" class="text-button" id="quiz-skip" data-action="quiz-skip">I’m not sure — show me</button></div></form>`;

function checkAnswer(skipped=false) {
  if(!session||!isSpellingMode(session.mode)||session.checked)return;
  if(session.mode==='listening'&&!skipped&&(!session.listening.plays||session.listening.busy))return;
  const input=document.getElementById('answer-input');
  const card=session.cards[session.index];
  const typed=input.value;
  const listening=session.mode==='listening';
  const heard=listening?session.listening.form:null;
  const expected=listening?{...card,forms:[heard],alternatives:[]}:card;
  const result=skipped?{status:'skipped'}:grade(expected,typed);
  if(result.status==='empty'){
    document.getElementById('answer-error').textContent='Try an answer, or tap “I’m not sure — show me.”';
    input.focus();return;
  }
  stopSpeech();
  session.checked=true;session.input=typed;session.feedback=result;
  if(listening){document.getElementById('listen-play').disabled=true;document.getElementById('listen-status').textContent='Answer revealed — listen again below to learn it.';document.getElementById('listen-error').hidden=true;}
  const correct=result.status==='correct';
  session.responses.push({id:card.id,correct,status:result.status,input:typed,...(listening?{heard}: {})});
  record(card,correct,session.mode);
  input.disabled=true; input.classList.add(correct?'is-correct':'is-wrong');
  document.getElementById('answer-error').textContent='';
  document.querySelectorAll('.accent-key').forEach(button=>button.disabled=true);
  const heading=correct?'You got it!':result.status==='accent'?'Almost — check the accent marks.':result.status==='skipped'?'Let’s learn this one.':'Not quite — here’s the word.';
  const helper=correct?'That spelling is correct.':result.status==='accent'?'An accent mark or the dots on ü need a little attention. This goes into your review pile.':'Read it, listen to it, and give it another go in your review round.';
  document.getElementById('quiz-feedback').innerHTML=`<div class="feedback ${correct?'correct':''}"><div class="feedback-heading">${icon(correct?'check':'info')}${heading}</div><p>${helper}</p>${listening?`<p>Meaning: ${e(card.en)}</p>`:''}<p class="feedback-answer" lang="es">${expected.forms.map(e).join(' <span class="muted">/</span> ')}</p>${listening?heardAudioHTML(card):audioGroup(card)}${listening?'<p class="study-note">Spell the form in the audio, not a different gender or synonym. El / la is optional.</p>':card.note?`<p class="study-note">${e(card.note)}</p>`:''}</div>`;
  const next=document.getElementById('quiz-submit');
  next.disabled=false;
  next.innerHTML=`${session.index===session.cards.length-1?'See my results':'Next word'} ${icon('arrow')}`;
  document.getElementById('quiz-skip').hidden=true;
  next.focus({preventScroll:true});
}
function nextCard() {

  if(view!=='practice'){destination==='home'?goHome():goSetup();return;}
  afterConfirm=()=>{destination==='home'?goHome():goSetup();};
  modalShell('Take a little break?',`<p>Your completed-card progress will stay saved on this device. This unfinished round won’t get a final score.</p>`,`<button class="secondary" data-action="dismiss">Keep practicing</button><button class="primary" data-action="confirm-leave">Leave round ${icon('arrow')}</button>`);
}
function resetProgress() {
  modalShell('Start fresh?',`<p>This clears the saved practice counts and tricky-word list on this device, and ends any current round. Your vocabulary and voice settings will stay.</p>`,`<button class="secondary" data-action="dismiss">Keep my progress</button><button class="primary" data-action="confirm-reset">Reset progress</button>`);
}
function handleAction(event) {
  const button=event.target.closest('[data-action]');
  if(!button||button.disabled)return;
  const action=button.dataset.action;
  if(action==='speak'&&session?.mode==='listening'&&view==='practice'&&!session.checked)return;
  if(action==='speak') { const c=byId.get(button.dataset.card); if(c)speak(c.forms[Number(button.dataset.form)||0]); return; }
  switch(action) {
    case 'start':goSetup();break;
    case 'mode':settings.mode=button.dataset.mode;save();renderSetup(false);document.querySelector(`[data-mode="${settings.mode}"]`).focus({preventScroll:true});break;
    case 'length':settings.length=button.dataset.length;save();renderSetup(false);document.querySelector(`[data-length="${settings.length}"]`).focus({preventScroll:true});break;
    case 'toggle-topics':settings.categories=settings.categories.length===DATA.categories.length?[]:DATA.categories.map(c=>c.id);save();renderSetup(false);document.querySelector('[data-action="toggle-topics"]').focus({preventScroll:true});break;
    case 'begin':beginRound();break;
    case 'flip':flipCard();break;
    case 'rate':rateCard(button.dataset.correct==='true');break;
    case 'flash-skip':rateCard(false,true);break;
    case 'listen-play':playListeningQuestion();break;
    case 'quiz-submit':session?.checked?nextCard():checkAnswer();break;
    case 'quiz-skip':checkAnswer(true);break;
    case 'accent': {
      const input=document.getElementById('answer-input');
      if(!input||input.disabled)return;
      input.focus({preventScroll:true});
      const start=input.selectionStart??input.value.length,end=input.selectionEnd??start;
      input.setRangeText(button.dataset.letter,start,end,'end');
      input.dispatchEvent(new Event('input',{bubbles:true}));break;
    }
    case 'leave':confirmLeave('setup');break;
    case 'confirm-leave': {const fn=afterConfirm;closeModal();fn?.();break;}
    case 'new-topics':goSetup();break;
    case 'play-again': {const pool=[...session.originalPool],mode=session.mode,retry=session.retry;beginRound(pool,mode,retry);break;}
    case 'retry-missed': {const pool=session.responses.filter(r=>!r.correct).map(r=>byId.get(r.id)),mode=session.mode;beginRound(pool,mode,true);break;}
    case 'learn-missed': {const pool=session.responses.filter(r=>!r.correct).map(r=>byId.get(r.id));beginRound(pool,'flashcards',true);break;}
    case 'word-list':openWordList();break;
    case 'achievements':openAchievements();break;
    case 'dismiss':closeModal();break;
    case 'test-audio':speak('mucho gusto');break;
    case 'reset-progress':resetProgress();break;
    case 'confirm-reset':stopSpeech();progress=freshProgress();onlyReview=false;save();closeModal();goHome();toast('Saved practice progress cleared. A fresh start.');break;
  }
}
document.addEventListener('click',handleAction);
document.addEventListener('pointerdown',event=>{if(event.target.closest('.accent-key'))event.preventDefault();});
document.addEventListener('submit',event=>{
  if(event.target.id!=='quiz-form')return;
  event.preventDefault();
  if(session?.checked)nextCard();else checkAnswer();
});
document.addEventListener('input',event=>{
  if(event.target.id==='word-search'){wordQuery=event.target.value;renderWordResults();}
  if(event.target.id==='answer-input'){document.getElementById('answer-error').textContent='';}
});
document.addEventListener('change',event=>{
  const el=event.target;
  if(el.name==='topic'){settings.categories=[...document.querySelectorAll('input[name="topic"]:checked')].map(c=>c.value);save();updateSetupCount();const b=document.querySelector('[data-action="toggle-topics"]');b.textContent=settings.categories.length===DATA.categories.length?'Clear selection':'Select all topics';}
  if(el.id==='only-review'){onlyReview=el.checked;updateSetupCount();}
  if(el.id==='word-filter'){wordFilter=el.value;renderWordResults();}
  if(el.id==='speed-select'){settings.speed=el.value;save();}
  if(el.id==='voice-select'){settings.voice=el.value;save();}
});
document.getElementById('brand-home').addEventListener('click',()=>confirmLeave('home'));
document.getElementById('close-app').innerHTML=icon('x');
document.getElementById('open-settings').innerHTML=icon('settings');
document.getElementById('close-app').addEventListener('click',()=>confirmLeave('home'));
document.getElementById('open-settings').addEventListener('click',openSettings);
document.getElementById('open-about').addEventListener('click',openAbout);
modal.addEventListener('cancel',()=>{afterConfirm=null;stopSpeech();});
modal.addEventListener('click',event=>{if(event.target===modal){const r=modal.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeModal();}});
window.addEventListener('pagehide',stopSpeech);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&session?.mode==='listening')stopSpeech();});
if('speechSynthesis' in window){window.speechSynthesis.addEventListener('voiceschanged',updateVoiceOptions);spanishVoices();}
// Progressive enhancement: the standalone HTML works without these hosted files.
if(/^https?:$/.test(location.protocol)) {
  const manifest=document.createElement('link');manifest.rel='manifest';manifest.href='./manifest.webmanifest';document.head.append(manifest);
  const touch=document.createElement('link');touch.rel='apple-touch-icon';touch.href='./icon-192.png';document.head.append(touch);
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
renderHome();
})();
</script>
</body>
</html>
