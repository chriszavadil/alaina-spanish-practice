<p class="storage-warning" id="storage-warning" role="status" hidden>This browser is not saving progress. Practice still works, but a reload may lose your results.</p><main id="main" tabindex="-1"></main><footer><span>Global Tapestry · 15 ideas worth knowing.<br><span id="version">History v1.1.1</span></span><button data-action="about">Sources & study notes</button></footer><div class="sr-only" id="announcer" role="status" aria-live="polite"></div><div class="toast" id="toast" role="status" hidden></div><dialog id="modal" aria-labelledby="modal-title"></dialog><noscript><p style="padding:30px">Please enable JavaScript to use History Studio.</p></noscript><script id="history-data" type="application/json">{"title":"Alaina’s History Studio","set":"Global Tapestry","version":"1.1.1","categories":[{"id":"power","name":"Power & society","label":"How people organized","symbol":"01"},{"id":"belief","name":"Beliefs & ideas","label":"How people understood the world","symbol":"02"},{"id":"exchange","name":"Trade & change","label":"How people and ideas connected","symbol":"03"}],"sources":{"caliphate":{"name":"Oxford Learner’s Dictionaries · Caliphate","url":"https://www.oxfordlearnersdictionaries.com/definition/english/caliphate"},"christianity":{"name":"Gettysburg College · Christianity","url":"https://www.gettysburg.edu/offices/religious-spiritual-life/world-religions-101/christianity"},"city":{"name":"Cambridge Dictionary · City state","url":"https://dictionary.cambridge.org/us/dictionary/english/city-state"},"silk":{"name":"UNESCO · About the Silk Roads","url":"https://www.unesco.org/en/silk-roads/about-silk-roads"},"feudal":{"name":"UC San Diego · Feudalism glossary","url":"https://pages.ucsd.edu/~dkjordan/cgi-bin/glossary.pl?tyimuh=feudalism"},"plague":{"name":"CDC · About plague","url":"https://www.cdc.gov/plague/about/index.html"},"blackdeath":{"name":"National Geographic · The plague","url":"https://www.nationalgeographic.com/science/article/the-plague"},"china":{"name":"Smithsonian National Museum of Asian Art · Beliefs and Values in Ancient China","url":"https://asia-archive.si.edu/learn/for-educators/teaching-china-with-the-smithsonian/lesson-plans/beliefs-and-values-in-ancient-china-buddhism-daoism-and-confucianism/"},"islam":{"name":"Gettysburg College · Islam and jihad","url":"https://www.gettysburg.edu/offices/religious-spiritual-life/world-religions-101/islam"},"dynasty":{"name":"Cambridge Dictionary · Dynasty","url":"https://dictionary.cambridge.org/us/dictionary/english/dynasty"},"merit":{"name":"Cambridge Dictionary · Meritocracy","url":"https://dictionary.cambridge.org/us/dictionary/english/meritocracy"},"caravan":{"name":"Oxford Learner’s Dictionaries · Caravan","url":"https://www.oxfordlearnersdictionaries.com/definition/english/caravan"},"luxury":{"name":"Oxford Learner’s Dictionaries · Luxury","url":"https://www.oxfordlearnersdictionaries.com/definition/english/luxury_1"}},"cards":[{"id":"caliphate","term":"Caliphate","category":"power","aliases":[],"definition":"A state or territory led by a caliph, a ruler who claims leadership of the Muslim community as a successor to Muhammad.","example":"A caliphate combines political rule with a claim to religious leadership.","scenario":"A territory is governed by a caliph. Which political term describes it?","cue":"Caliph = leader; caliphate = the state or rule.","note":"A caliph is not a new prophet. This is a historical political institution, not another name for Islam.","sketch":"A simple building with a leader’s chair inside. Label it ‘caliph’. Place a border around the territory.","sources":["caliphate","islam"],"scenarios":[{"text":"A traveler enters a territory whose ruler is called a caliph. The ruler claims both political authority and leadership of the Muslim community. Which term describes the state the traveler has entered?","why":"A caliphate is the state or territory ruled by a caliph. The clue is the form of government, not simply the religion practiced there."},{"text":"A student is sorting descriptions of governments. One describes a state led by someone claiming to succeed Muhammad in leading the Muslim community. Which heading belongs above that description?","why":"The political institution led by a caliph is a caliphate. The caliph is a community leader, not a new prophet."},{"text":"Officials in several cities report to a ruler called a caliph, who claims leadership of the Muslim community as well as political authority. What term describes the larger state those cities belong to?","why":"The state is a caliphate because it is ruled by a caliph. A city within that state is not an independent city-state simply because it has local officials."}]},{"id":"christianity","term":"Christianity","category":"belief","aliases":[],"definition":"A monotheistic religion centered on Jesus Christ, his life and teachings, and Christian beliefs about his death and resurrection.","example":"The teachings of Jesus are central to Christianity.","scenario":"A religion centers on Jesus Christ and beliefs about his resurrection. Which is it?","cue":"Christ → Christianity.","note":"Monotheistic means belief in one God. Christians belong to many different traditions and denominations.","sketch":"Draw a simple cross beside an open book. Use the labels ‘Jesus’ and ‘teachings’.","sources":["christianity"],"scenarios":[{"text":"A family gathers for worship and reads about Jesus Christ. Their beliefs center on his teachings, death, and resurrection. Which religion is being described?","why":"Jesus Christ and beliefs about his resurrection are central to Christianity. These clues identify the religion more clearly than worship alone would."},{"text":"In a classroom presentation, a student describes a monotheistic faith whose followers look to Jesus as the Christ. Which term should appear as the presentation's title?","why":"Christianity is the monotheistic religion centered on Jesus Christ. Monotheism alone would not identify it, but the reference to Jesus does."},{"text":"A museum visitor reads a Gospel passage about Jesus and sees an exhibit explaining belief in his resurrection. The guide says these beliefs unite many different churches. Which religion connects the exhibit?","why":"The focus on Jesus Christ and his resurrection points to Christianity. Different churches can share this central religious identity without having identical practices."}]},{"id":"city-state","term":"City-state","category":"power","aliases":["city state","citystate"],"definition":"An independent state made up of a city and the surrounding territory it governs.","example":"A city-state has its own government rather than being only a city inside a larger state.","scenario":"One city and its nearby land govern themselves independently. What is this political unit?","cue":"A city that acts as its own state.","note":"Independence is the key difference between a city-state and an ordinary city.","sketch":"Draw a city wall around a few buildings and nearby fields, with one flag inside.","sources":["city"],"scenarios":[{"text":"A walled city makes its own laws and governs the farms around it. It is independent, not part of a larger country. What kind of political unit is it?","why":"A city-state consists of an independent city and the surrounding territory it governs. A wall alone is not enough; independence is the key clue."},{"text":"Two neighboring cities each have their own independent government and nearby territory. Neither answers to a shared national government. What could each city and its land be called?","why":"Each city acts as its own state, so each is a city-state. An ordinary city within a country would not meet the independence condition."},{"text":"A harbor city makes its own treaty with a neighboring country and governs the countryside around its port. It answers to no larger national government. What kind of political unit is the city and its territory?","why":"The city and its surrounding land form an independent city-state. Making its own decisions as a state, rather than simply having a busy port, is the important clue."}]},{"id":"caravan","term":"Caravan","category":"exchange","aliases":[],"definition":"A group of travelers, often merchants with pack animals, moving together across long distances.","example":"Merchants traveled in a caravan carrying goods between trading centers.","scenario":"Merchants and their loaded pack animals travel together across a long land route. What is the group called?","cue":"Caravan = the traveling group, not the route.","note":"Camels are a familiar example, but caravans could also use other pack animals.","sketch":"Draw three pack animals in a line, each with a small bundle on its back.","sources":["caravan","silk"],"scenarios":[{"text":"Several merchants load bundles onto pack animals and set off together across a desert. Which term names the traveling group, rather than the road or the goods?","why":"The merchants and pack animals traveling together form a caravan. The group is different from a trade route such as the Silk Road."},{"text":"A traveler sees a long line of traders and loaded animals moving together between towns. They plan to stay together for the journey. What is this group called?","why":"A caravan is a group traveling together, often with pack animals and merchandise. It does not have to contain only camels."},{"text":"Before crossing a mountain pass, a guide brings several merchants together with their loaded mules. The people and animals will make the long journey as one group. What term names that group?","why":"The travelers and pack animals form a caravan. The animals can be mules rather than camels; the defining feature is the group traveling together, not a particular animal or landscape."}]},{"id":"feudalism","term":"Feudalism","category":"power","aliases":[],"definition":"A system of relationships in medieval Europe in which lords granted land or rights to vassals in return for loyalty and service, often military service.","example":"A vassal might receive a fief in exchange for military service under feudalism.","scenario":"A lord grants a vassal land rights in return for loyalty and military service. Which term fits?","cue":"Land ↔ loyalty and service.","note":"This is a simplified classroom model. Medieval arrangements varied; historians debate how broadly this label should be used.","sketch":"Draw a parcel of land and a shield with arrows between them. Label the arrows ‘land’ and ‘service’.","sources":["feudal"],"scenarios":[{"text":"A medieval lord gives a vassal rights to a piece of land. In return, the vassal promises loyalty and military service. Which system of relationships does this illustrate?","why":"The exchange of land or rights for loyalty and service is central to the classroom model of feudalism. The bargain, not just the presence of a king, is the clue."},{"text":"In a medieval-history role-play, one student offers land rights and another promises to provide service when called upon. They are acting as a lord and a vassal. Which concept are they modeling?","why":"They are modeling feudalism through the lord-vassal relationship. Real medieval arrangements varied, so this is a simplified learning example."},{"text":"In a medieval-history simulation, a knight is called to provide military service to a lord. The knight holds land rights in return for this service and loyalty. Which system explains the obligation?","why":"The land rights and the promise of loyal service illustrate the lord-vassal relationships associated with feudalism. This is a simplified classroom example, not a rule for every medieval society."}]},{"id":"silk-road","term":"Silk Road","category":"exchange","aliases":["Silk Roads"],"definition":"A network of trade routes linking regions of Asia with the Middle East and Europe, carrying goods, ideas, technologies, and beliefs.","example":"Traders exchanged more than silk along the Silk Road.","scenario":"Goods, beliefs, and technologies move across connected trade routes between Asia and Europe. Which network is described?","cue":"Many connected routes—not one road.","note":"‘Silk Roads’ emphasizes the network. Wider connections included maritime routes and Africa.","sketch":"Connect three towns with several dotted routes instead of one straight line.","sources":["silk"],"scenarios":[{"text":"A map shows many connected trade routes linking regions of Asia, the Middle East, and Europe. Goods, ideas, and beliefs move along them. Which network is the map showing?","why":"The Silk Road was a network of connected trade routes, not one single road. The movement of ideas and beliefs alongside goods is another important clue."},{"text":"A merchant passes goods to another trader, who carries them farther west. Across a linked network between Asia and Europe, technologies and beliefs travel too. Which term names the network, not a group of travelers?","why":"The Silk Road names the trade network. A caravan would name a traveling group, while luxury goods would describe some of the items being traded."},{"text":"For a class project, a student traces how craft techniques and religious ideas spread through trading towns between Asia, the Middle East, and Europe. Which connected trade network should the project identify?","why":"The Silk Road connected trading communities and helped carry ideas and techniques as well as goods. The question asks for the network, not the people traveling in a caravan."}]},{"id":"black-plague","term":"Black Plague","category":"exchange","aliases":["Black Death"],"definition":"The devastating plague pandemic of the 1300s, commonly called the Black Death, that killed millions across parts of Eurasia and North Africa.","example":"The Black Plague caused major population losses in medieval Europe.","scenario":"A fourteenth-century plague pandemic devastates communities across several regions. Which event is this?","cue":"Black Plague = Black Death.","note":"Plague is caused by the bacterium Yersinia pestis—not a virus. Infected fleas helped transmit it.","sketch":"Draw a small flea beside a town and a calendar labeled ‘1300s’; avoid graphic images.","sources":["plague","blackdeath"],"scenarios":[{"text":"A history book describes a devastating plague pandemic in the 1300s that killed millions across parts of Eurasia and North Africa. Which event is the class studying?","why":"This is the Black Plague, commonly called the Black Death. The time period and widespread pandemic distinguish it from a small local outbreak."},{"text":"A museum display explains a fourteenth-century pandemic that caused enormous population losses. It notes that plague is caused by bacteria, not a virus. Which event fits the display?","why":"The fourteenth-century plague pandemic is the Black Plague or Black Death. The bacterial cause also corrects a common misunderstanding about plague."},{"text":"In a history simulation set in the mid-1300s, many towns lose large numbers of residents during a widespread plague pandemic. The class must name the event behind this population decline. Which term fits?","why":"The time period and devastating plague pandemic identify the Black Plague, also called the Black Death. This is an illustrative simulation of the event, not a claim about one particular town."}]},{"id":"daoism","term":"Daoism","category":"belief","aliases":["Taoism"],"definition":"A Chinese philosophical and religious tradition that emphasizes living in harmony with the Dao, or ‘Way’, and the natural order.","example":"Daoism encourages harmony with the natural flow of life.","scenario":"A Chinese tradition emphasizes harmony with the Way and the natural order. Which one?","cue":"Dao = Way.","note":"Taoism is an alternative English spelling and is accepted here.","sketch":"Draw a winding stream between two hills to suggest following nature’s flow.","sources":["china"],"scenarios":[{"text":"A teacher in a Chinese philosophical tradition compares a wise life to water following a natural course. The lesson emphasizes harmony with the Way rather than forcing everything to obey personal wishes. Which tradition fits?","why":"Daoism emphasizes harmony with the Dao, or Way, and the natural order. The water comparison is an illustrative memory aid, not a quotation."},{"text":"Someone studying Chinese traditions chooses a path focused on living in harmony with nature and the Dao. Which term names the tradition they are exploring?","why":"The reference to the Dao identifies Daoism, also spelled Taoism. Nature alone could be a broad clue, but the Way makes the connection specific."},{"text":"A learner wants every plan to follow their wishes. A teacher drawing on Laozi instead asks them to observe natural patterns and live in harmony with the Way. Which Chinese tradition guides this advice?","why":"Laozi and harmony with the Dao, or Way, are specific clues for Daoism. The advice illustrates the tradition without claiming that simply enjoying nature makes someone a follower."}]},{"id":"islam","term":"Islam","category":"belief","aliases":[],"definition":"A monotheistic religion whose followers, called Muslims, submit to one God, Allah, and regard Muhammad as God’s final prophet.","example":"Muslims follow Islam and regard the Quran as sacred scripture.","scenario":"Followers are called Muslims and regard Muhammad as God’s final prophet. Which religion?","cue":"Islam = religion; Muslim = follower.","note":"Allah is the Arabic word for God. Muslims worship God, not Muhammad.","sketch":"Draw a book labeled ‘Quran’ and five simple pillars for the Five Pillars.","sources":["islam"],"scenarios":[{"text":"A student describes a faith whose followers are Muslims. They worship one God, called Allah in Arabic, and regard Muhammad as God's final prophet. Which religion is it?","why":"These beliefs identify Islam. Islam names the religion, while Muslim names a follower; Muhammad is regarded as a prophet, not as God."},{"text":"A family explains that the Quran is their sacred scripture and that they submit to one God. They identify themselves as Muslims. Which religion are they describing?","why":"Islam is the religion practiced by Muslims, with the Quran as sacred scripture. This asks for the religion, not a particular government or personal practice."},{"text":"During a school visit, a community member explains that they read the Quran, worship Allah alone, and follow Muhammad as a prophet rather than a god. Which religion are they describing?","why":"The Quran, worship of one God, and Muhammad as a prophet identify Islam. The question is about the religion, not a political institution such as a caliphate."}]},{"id":"luxury-goods","term":"Luxury Goods","category":"exchange","aliases":["luxury good"],"definition":"Nonessential items valued for comfort, beauty, rarity, or status, often costing much more than basic necessities.","example":"Fine silk and precious stones could be traded as luxury goods.","scenario":"A merchant sells rare silk and jewels for status and beauty rather than basic survival. What kind of goods are these?","cue":"Wanted for comfort or status; not basic needs.","note":"Whether an item is a luxury depends on its society and circumstances.","sketch":"Draw a gem beside a roll of fine cloth, each with a price tag.","sources":["luxury","silk"],"scenarios":[{"text":"A wealthy customer buys rare jewels and finely made silk to display status, although neither is needed for basic survival. Which term describes these purchases?","why":"These are luxury goods: nonessential items prized for beauty, rarity, comfort, or status. Their purpose in the scenario separates them from basic necessities."},{"text":"At a market, a shopper passes over a simple everyday bag and buys an expensive decorated one mainly for prestige. Which category best describes the decorated bag in this situation?","why":"Here the decorated bag is a luxury good because it is chosen for prestige rather than basic need. What counts as a luxury depends on the situation."},{"text":"A household already has everyday dishes but spends much more on an ornate gold cup to impress guests. The purchase is mainly for beauty and status rather than a basic need. Which category best describes it?","why":"The cup is an example of luxury goods because its special value here is beauty and status, not meeting a basic need. The situation explains why this particular purchase is a luxury."}]},{"id":"jihad","term":"Jihad","category":"belief","aliases":[],"definition":"In Islam, striving or struggle in the path of God, including efforts to live faithfully and do what is right.","example":"A Muslim’s effort to resist wrongdoing can be understood as jihad.","scenario":"A Muslim describes the effort to overcome wrongdoing and live faithfully. Which term names this striving?","cue":"Striving or effort—not simply a synonym for war.","note":"The term also has an armed-struggle meaning in Islamic history and law. Its meaning depends on context.","sketch":"Draw a person choosing between two paths, with the better path labeled ‘right action’.","sources":["islam"],"scenarios":[{"text":"A Muslim works to resist the temptation to cheat and to act honestly as an effort in the path of God. Which term can describe this striving, rather than the religion as a whole?","why":"Jihad can mean striving to live faithfully and do what is right. This scenario illustrates spiritual and moral effort; the term also has an armed-struggle meaning in other contexts."},{"text":"A Muslim describes an ongoing struggle to overcome selfish habits and follow God's guidance. The question asks for the word for that religious striving. Which term fits?","why":"The striving described here is an example of jihad. The example shows one meaning and does not imply that jihad has only a personal or only a military meaning."},{"text":"A Muslim learner keeps setting aside distractions to study their faith and live according to God’s guidance. They describe this sustained effort as striving in God’s path. Which word names the effort?","why":"This religious striving is an example of jihad in its spiritual sense. The term can have other meanings in different historical and legal contexts; this scenario concerns learning and faithful living."}]},{"id":"dynasty","term":"Dynasty","category":"power","aliases":[],"definition":"A succession of rulers from the same family or lineage.","example":"When several generations of one family rule, they form a dynasty.","scenario":"A ruler is followed by relatives, and the same family remains in power for generations. What is this line of rulers?","cue":"Rule passed through a family.","note":"The term describes a line of rulers, not just one powerful individual.","sketch":"Draw a small family tree with a crown above each generation.","sources":["dynasty"],"scenarios":[{"text":"A ruler is succeeded by a relative. Several more relatives from the same family rule over the next generations. What is this line of rulers called?","why":"A succession of rulers from the same family or lineage is a dynasty. One ruler alone does not establish the family succession described here."},{"text":"A museum timeline places several rulers beneath one family tree. The guide explains that political power stayed within that family for generations. Which term labels the group of rulers?","why":"Dynasty names the ruling family line across generations. The family connection, rather than a method of earning office, is the key clue."},{"text":"In a fictional kingdom, power passes from a queen to her son and later to her granddaughter. A historian groups their reigns together because all three belong to the same ruling family. What is that line of rulers called?","why":"A succession of rulers from the same family forms a dynasty. The family connection across reigns matters, rather than any single ruler’s wealth or achievements."}]},{"id":"confucianism","term":"Confucianism","category":"belief","aliases":[],"definition":"A Chinese ethical and philosophical tradition associated with Confucius, emphasizing moral behavior, education, family duties, and good relationships.","example":"Respect for family responsibilities is important in Confucianism.","scenario":"A Chinese tradition emphasizes education, moral conduct, and duties within family and society. Which one?","cue":"Confucius → conduct, learning, relationships.","note":"It focuses on how people should behave and relate to one another.","sketch":"Draw a student, a teacher, and a family connected by lines labeled ‘respect’.","sources":["china"],"scenarios":[{"text":"A teacher following Confucius emphasizes learning, moral conduct, and responsibilities toward family and society. Which tradition shapes these lessons?","why":"Confucianism emphasizes ethical behavior, education, duties, and good relationships. The reference to Confucius and family responsibilities makes the connection clear."},{"text":"A student studies a Chinese tradition in which people should improve their conduct, respect family responsibilities, and help create a well-ordered society. The teachings are associated with Confucius. Which tradition is it?","why":"These are central themes of Confucianism. This is about relationships and moral conduct, not simply a hiring system or a general interest in nature."},{"text":"An official studying Confucius tries to govern honestly, care for family responsibilities, and set a good moral example for others. Which tradition connects the official’s public conduct and family duties?","why":"Confucianism emphasizes moral conduct and responsibilities within family and society. Confucius is the specific clue; honesty or family care alone would not identify just one tradition."}]},{"id":"meritocracy","term":"Meritocracy","category":"power","aliases":[],"definition":"A system in which people gain positions or rewards based on ability and achievement rather than inherited status or personal connections.","example":"Selecting an official by demonstrated ability reflects the ideal of meritocracy.","scenario":"Candidates are selected for skill and achievement, not family connections. What principle is being used?","cue":"Merit = demonstrated ability and achievement.","note":"This describes an ideal. Calling a system meritocratic does not prove that everyone has equal opportunities.","sketch":"Draw a skills test leading to a job, rather than a family tree leading to that job.","sources":["merit"],"scenarios":[{"text":"A council chooses an official by comparing demonstrated skills and achievements. A powerful family's relative does not receive special preference. Which principle is the council trying to follow?","why":"Meritocracy favors ability and achievement rather than inherited status or personal connections. The example illustrates the ideal, not proof that every opportunity is equal."},{"text":"A workplace awards a leadership role to the person with the strongest relevant performance, not the owner's friend. Which term describes the selection principle?","why":"Choosing on demonstrated merit illustrates meritocracy. The clue is how the role is awarded, rather than who inherits power."},{"text":"A school awards a scholarship using demonstrated skills and achievement. The judges assess the work without giving preference to famous parents or influential friends. Which principle is the selection meant to follow?","why":"Choosing by ability and achievement illustrates the ideal of meritocracy. It contrasts with inherited advantages or personal connections, although this example does not prove that every applicant had equal opportunities."}]},{"id":"buddhism","term":"Buddhism","category":"belief","aliases":[],"definition":"A religious and philosophical tradition based on the Buddha’s teachings about suffering, ethical living, and the path to liberation.","example":"Meditation is an important practice in many forms of Buddhism.","scenario":"A tradition follows the Buddha’s teachings about suffering and liberation. Which one?","cue":"Buddha → Buddhism.","note":"Practices vary among Buddhist traditions. Meditation is not their only practice.","sketch":"Draw a seated person beside a path labeled ‘ethical living’ and ‘wisdom’.","sources":["china"],"scenarios":[{"text":"A learner studies the Buddha's teachings about suffering and liberation, practices ethical behavior, and meditates. Which tradition is the learner exploring?","why":"Buddhism is based on the Buddha's teachings, including the path away from suffering. Meditation alone is not unique to Buddhism; the Buddha and these teachings identify it."},{"text":"A teacher asks students to examine suffering and follow a path of ethical living and wisdom taught by the Buddha. Which tradition do these lessons belong to?","why":"The reference to the Buddha and liberation from suffering points to Buddhism. Practices vary among Buddhist traditions, so this is a broad learning example."},{"text":"At a study group, a learner asks how to respond to suffering without harming others. The group turns to the Buddha’s teachings and a path of ethical action and wisdom toward liberation. Which tradition guides the discussion?","why":"The Buddha’s teachings about suffering and liberation identify Buddhism. The scenario applies those teachings to a learner’s concern rather than treating meditation as the tradition’s only practice."}]}]}</script><script>/* History-only pure functions. Does not read or write another app's storage. */
(function(root){'use strict';
function normalize(value){return String(value??'').normalize('NFKC').toLocaleLowerCase('en-US').replace(/[\u2010-\u2015-]/gu,' ').replace(/^[\s.,!?]+|[\s.,!?]+$/gu,'').replace(/\s+/gu,' ').trim();}
function grade(card,value,mode='type'){const answer=normalize(value);if(!answer)return 'empty';const forms=mode==='listen'?[card.term]:[card.term,...(card.aliases||[])];return forms.some(x=>normalize(x)===answer)?'correct':'incorrect';}
function shuffle(items,random=Math.random){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function deck(pool,size,last=[]){let a=shuffle(pool);const n=size==='all'?a.length:Math.min(a.length,Number(size)||5);if(n>1&&last.length===n&&a.slice(0,n).every((x,i)=>x===last[i]))a.push(a.shift());return a.slice(0,n);}
function options(card,all){const other=shuffle(all.filter(x=>x.id!==card.id)).slice(0,3).map(x=>x.id);return shuffle([card.id,...other]);}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/gu,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));}
const api={normalize,grade,shuffle,deck,options,escapeHTML};root.HistoryCore=api;if(typeof module!=='undefined')module.exports=api;
})(typeof globalThis==='undefined'?this:globalThis);
</script><script>/* Alaina's History Studio. Independent app, vocabulary, storage and service worker. */
(function(){'use strict';
const DATA=JSON.parse(document.getElementById('history-data').textContent),CARDS=DATA.cards,CATS=DATA.categories,BY=new Map(CARDS.map(c=>[c.id,c]));
const {escapeHTML:e,grade,deck,options,normalize}=HistoryCore,STORE='alaina-history-studio-v1',VERSION=DATA.version,main=document.getElementById('main'),modal=document.getElementById('modal');
const modes=[['flash','Flashcards','Learn a term, then flip for its meaning.','cards'],['choice','Meaning Quiz','Match definitions and examples to terms.','check'],['scenario','Scenario Practice','Read a situation. Choose the matching term.','book'],['type','Recall Challenge','Read the definition. Type the term.','pencil'],['listen','Listen & Spell','Hear an English term. Spell what you hear.','sound']];
const icons={home:'<path d="m3 11 9-8 9 8M5 10v11h14V10M9 21v-7h6v7"/>',cards:'<rect x="7" y="6" width="13" height="15" rx="2"/><path d="M4 17H3V3h13m-5 9h5m-5 4h5"/>',check:'<path d="m4 12 5 5L20 6"/>',pencil:'<path d="m3 21 5-1L21 7l-4-4L4 16l-1 5ZM14 6l4 4"/>',sound:'<path d="m11 5-6 4H2v6h3l6 4V5Z"/><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',back:'<path d="M20 12H4m6-6-6 6 6 6"/>',book:'<path d="M12 5v16M3 3c4 0 7 1 9 3 2-2 5-3 9-3v15c-4 0-7 1-9 3-2-2-5-3-9-3V3Z"/>',settings:'<path d="M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1Z"/><circle cx="12" cy="12" r="3"/>',x:'<path d="m6 6 12 12M18 6 6 18"/>',repeat:'<path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3"/>'};
function icon(name){return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.book}</svg>`;}
const fresh=()=>({schema:1,settings:{mode:'flash',length:'5',topics:CATS.map(c=>c.id),rate:'0.9',voice:''},progress:{items:{},rounds:0,perfect:0,earned:{}},session:null,lastOrder:[],scenarioLast:{}});
let storageOK=true,db=fresh(),view='home',onlyReview=false,libraryQuery='',libraryTopic='',speechToken=0,activeSpeech=null,cancelSpeech=null,audioBusy=false,audioMessage='',toastTimer,nextTimer,confirmFn=null;
function isChoice(mode){return mode==='choice'||mode==='scenario';}
function scenarioIndex(card,value){return Number.isInteger(value)&&value>=0&&value<card.scenarios.length?value:0;}
function situation(card,question){return card.scenarios[scenarioIndex(card,question?.scenarioIndex)];}
function integer(x){return Math.max(0,Math.min(1000000,Math.floor(Number(x)||0)));}
function validate(raw){const out=fresh();if(!raw||typeof raw!=='object')return out;const s=raw.settings||{};

function speakText(text,done=()=>{}){stopSpeech();const token=speechToken;let settled=false,startTimer,endTimer;const settle=(ok)=>{if(settled)return;settled=true;clearTimeout(startTimer);clearTimeout(endTimer);if(token!==speechToken)return;activeSpeech=null;cancelSpeech=null;done(ok);};
 if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){done(false);return;}
 try{const voices=speechSynthesis.getVoices(),english=voices.filter(v=>/^en(?:-|_|$)/i.test(v.lang));if(voices.length&&!english.length){done(false);return;}const v=english.find(v=>v.voiceURI===db.settings.voice)||english.find(v=>v.lang==='en-US')||english[0];const u=new SpeechSynthesisUtterance(text);u.lang=v?.lang||'en-US';if(v)u.voice=v;u.rate=Number(db.settings.rate);u.volume=1;u.onstart=()=>{if(token!==speechToken||settled)return;clearTimeout(startTimer);endTimer=setTimeout(()=>{settle(false);try{speechSynthesis.cancel();}catch(_){}},45000);};u.onend=()=>settle(true);u.onerror=()=>settle(false);activeSpeech=u;cancelSpeech=settle;startTimer=setTimeout(()=>{settle(false);try{speechSynthesis.cancel();}catch(_){}},6500);speechSynthesis.resume();speechSynthesis.speak(u);}catch(_){settle(false);}}
function playQuestion(){const q=session();if(view!=='practice'||!q||q.mode!=='listen'||q.checked||q.plays>=4||audioBusy)return;const key=qkey();audioMessage='';speakText(current().term,ok=>{if(view!=='practice'||!session()||qkey()!==key||q.checked)return;audioBusy=false;if(ok){q.plays++;save();}else audioMessage='Audio did not finish. Check the volume or voice in Settings, then try Play again. This listen was not used.';audioControls();});audioBusy=!!activeSpeech;audioControls();}
function audioControls(){const q=session(),b=document.getElementById('listen-play'),s=document.getElementById('audio-status'),error=document.getElementById('audio-error');if(!b||!q)return;if(q.checked){b.disabled=true;b.innerHTML=icon('sound')+' Answer shown';s.textContent='Listen again below to learn the answer.';error.textContent='';return;}const remaining=4-q.plays;b.disabled=audioBusy||remaining===0;b.innerHTML=icon('sound')+' '+(audioBusy?'Playing…':q.plays===0?'Play term':remaining?`Play again (${remaining} left)`:'No replays left');s.textContent=audioBusy?'Listen carefully.':q.plays===0?'One first listen + 3 replays.':remaining?`${remaining} ${remaining===1?'replay':'replays'} left for this question.`:'All 4 listens used. Now spell the term.';error.textContent=audioMessage;const check=document.getElementById('quiz-action');if(check)check.disabled=audioBusy||q.plays===0;}
function library(){stopSpeech();view='library';mount(`<section class="library"><p class="eyebrow">The Global Tapestry collection</p><div class="topline"><h1>All your terms,<br>together.</h1>${button('home',icon('back'),'icon-button','aria-label="Home"')}</div><p class="muted">15 unique terms from your pages. Definitions are clarified for studying; examples and sketch ideas help make connections.</p><div class="search-controls"><input id="search" type="search" aria-label="Search terms or definitions" placeholder="Search a term or idea…" value="${e(libraryQuery)}"><select id="library-topic" aria-label="Filter by topic"><option value="">All topics</option>${CATS.map(c=>`<option value="${c.id}" ${libraryTopic===c.id?'selected':''}>${e(c.name)}</option>`).join('')}</select></div><p class="note" id="library-count" role="status"></p><div id="entries"></div></section>`);renderEntries();}
function renderEntries(){const list=CARDS.filter(c=>(!libraryTopic||c.category===libraryTopic)&&normalize([c.term,c.definition,...c.aliases].join(' ')).includes(normalize(libraryQuery)));document.getElementById('library-count').textContent=`${list.length} of 15 terms`;document.getElementById('entries').innerHTML=list.map(c=>`<article class="word-entry"><div class="entry-head"><div><span class="label">${e(cat(c).name)}</span><h2>${e(c.term)}</h2></div>${button('speak',icon('sound'),'icon-button',`data-id="${c.id}" data-kind="definition" aria-label="Hear ${e(c.term)}"`)}</div><p class="definition">${e(c.definition)}</p>${details(c)}${c.aliases.length?`<p class="note">Alternate names accepted in Recall Challenge: ${c.aliases.map(e).join(', ')}.</p>`:''}</article>`).join('')||'<p>No matching terms. Try a different search.</p>';}
function dialog(title,body,actions=''){stopSpeech();modal.innerHTML=`<div class="modal-top"><h2 id="modal-title">${e(title)}</h2>${button('dismiss',icon('x'),'icon-button','aria-label="Close dialog"')}</div><div class="modal-body">${body}</div>${actions?`<div class="button-row">${actions}</div>`:''}`;if(!modal.open)modal.showModal();}
function dismiss(){modal.close();confirmFn=null;if(view==='practice'&&session()?.mode==='listen'&&!session().checked){audioMessage='Playback paused. Tap Play to continue; unfinished audio did not use a listen.';audioControls();}}
function confirm(title,text,fn,label){confirmFn=fn;dialog(title,`<p>${e(text)}</p>`,button('confirm',e(label))+button('dismiss','Cancel','secondary'));}
function achievements(){dialog('Your achievements',`<p>${badges().filter(b=>b.earned).length} of 6 unlocked. Every small step counts.</p><div class="badges" style="margin-top:18px">${badges().map(b=>`<article class="badge ${b.earned?'earned':''}"><span class="emoji" aria-hidden="true">${b.emoji}</span><strong>${b.earned?'✓ ':''}${e(b.name)}</strong><small>${e(b.desc)}</small></article>`).join('')}</div>`);}
function settings(){dialog('Make yourself comfortable',`<label class="setting-label" for="rate">Speaking speed</label><select class="setting-select" id="rate">${[['0.75','Slow and clear'],['0.9','A little slower'],['1','Normal']].map(([v,t])=>`<option value="${v}" ${v===db.settings.rate?'selected':''}>${t}</option>`).join('')}</select><label class="setting-label" for="voice">English pronunciation voice</label><select class="setting-select" id="voice"><option value="">Device default English voice</option></select><div class="button-row">${button('test-audio',icon('sound')+' Test pronunciation','secondary')}</div><p class="note">Audio uses your device’s English speech voices. Sound availability and pronunciation depend on the device; some voices need an internet connection.</p><h3>Your practice stays here</h3><p>History progress stays in this browser. It does not sync across devices. Spanish progress is separate. No account, ads, microphone, or analytics.</p><div class="button-row">${button('export','Back up history progress','secondary')}${button('import','Restore a backup','text-btn')}</div><input type="file" id="import-file" accept="application/json,.json" hidden><p class="note">A backup contains only this history app’s settings and study results.</p><h3>A fresh start</h3>${button('reset','Reset history progress','text-btn danger')}`);voiceOptions();}
function voiceOptions(){const select=document.getElementById('voice');if(!select)return;let voices=[];try{voices=(window.speechSynthesis?.getVoices()||[]).filter(v=>/^en(?:-|_|$)/i.test(v.lang));}catch(_){}select.innerHTML='<option value="">Device default English voice</option>'+voices.map(v=>`<option value="${e(v.voiceURI)}" ${db.settings.voice===v.voiceURI?'selected':''}>${e(v.name)} (${e(v.lang)})</option>`).join('');}
function about(){dialog('About this collection',`<p><strong>Global Tapestry · 15 terms.</strong> Based on the four unique worksheet pages you supplied; the repeated photograph is included only once. Handwriting, names, grades, and photos are not published.</p><p>Definitions are original study-friendly summaries, not verbatim teacher answer keys. Example situations and sketch suggestions are learning aids. Classroom instructions still take priority for graded work.</p><p>Clarifications include the bacterial cause of plague, the multiple meanings of jihad, and the difference between a caliphate and Islam. Alternate names such as Taoism and Black Death are accepted in Recall Challenge; Listen & Spell asks for the exact term spoken.</p><p>Scenario Practice has its own 45 illustrative situations, three per term, with explanations after checking. Scenario examples are also available in the Word list and on revealed flashcards. Meaning Quiz keeps its original mix; Recall Challenge uses definitions. Flashcards are self-assessed; a spelling score alone is not a measure of historical understanding.</p><h3>References</h3><div class="sources">${Object.values(DATA.sources).map(s=>`<a href="${e(s.url)}" target="_blank" rel="noopener noreferrer">${e(s.name)} ↗</a>`).join('')}</div><p class="note">History Studio ${VERSION}. The X pauses a round and returns home; it does not close Safari. Offline study works after a successful online visit; audio still depends on available voices.</p>`);}
function exportProgress(){const payload={app:STORE,exportedAt:new Date().toISOString(),data:db};const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.href=url;a.download='Alaina-History-Progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('History backup prepared. Save it somewhere safe.');}
function handle(event){const b=event.target.closest('[data-action]');if(!b||b.disabled||!b.isConnected)return;if(b.dataset.q&&b.dataset.q!==qkey())return;const action=b.dataset.action;
 switch(action){case 'home':case 'close':if(view==='practice')save();home();break;case 'setup':setup();break;case 'scenario-setup':db.settings.mode='scenario';save();setup();break;case 'library':libraryQuery='';libraryTopic='';library();break;case 'mode':db.settings.mode=b.dataset.mode;save();setup();break;case 'length':db.settings.length=b.dataset.length;save();setup();break;case 'all-topics':db.settings.topics=db.settings.topics.length===3?[]:CATS.map(c=>c.id);save();setup();break;case 'begin':requestBegin();break;case 'resume':resume();break;case 'flip':if(view==='practice'&&session()?.mode==='flash'){session().revealed=!session().revealed;save();renderQuestion();}break;case 'known':rate('known');break;case 'again':rate('again');break;case 'choose':if(view==='practice'&&!session().checked){session().selected=b.dataset.choice;save();document.querySelectorAll('.choice').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.getElementById('answer-error').textContent='';document.getElementById('show-answer').textContent='Check & show answer';}break;case 'check':checkAnswer();break;case 'show':checkAnswer(true);break;case 'next':advance();break;case 'play':playQuestion();break;case 'speak':{if(view==='practice'&&session()?.mode==='listen'&&!session().checked)return;const c=BY.get(b.dataset.id)||current();if(c)speakText(b.dataset.kind==='definition'?c.term+'. '+c.definition:c.term,ok=>{if(!ok)toast('Audio could not finish. Check the volume or English voice in Settings.');});break;}case 'retry':{const q=session();begin(q.responses.filter(r=>['incorrect','shown','again'].includes(r.status)).map(r=>r.id),q.mode);break;}case 'again-round':{const q=session();begin(q.ids,q.mode);break;}case 'badges':achievements();break;case 'settings':settings();break;case 'about':about();break;case 'dismiss':dismiss();break;case 'confirm':{const fn=confirmFn;dismiss();fn?.();break;}case 'test-audio':speakText('Welcome to Alaina’s History Studio. One idea at a time.',ok=>toast(ok?'Pronunciation finished.':'Audio unavailable. Check volume or choose another English voice.'));break;case 'export':exportProgress();break;case 'import':document.getElementById('import-file').click();break;case 'reset':confirm('Reset history progress?','This removes only history scores, achievements, and the saved history round in this browser. It does not touch Spanish progress.',()=>{const s=db.settings;db=fresh();db.settings=s;save();home();toast('History progress reset.');},'Reset history');break;}
}
document.addEventListener('click',handle);
document.addEventListener('submit',event=>{if(event.target.id!=='quiz-form')return;event.preventDefault();if(!session()?.checked)checkAnswer();});
document.addEventListener('keydown',event=>{if(view==='practice'&&event.key==='Enter'&&event.repeat)event.preventDefault();});
document.addEventListener('input',event=>{const t=event.target;if(t.id==='answer'&&session()&&!session().checked){session().input=t.value;save();document.getElementById('answer-error').textContent='';document.getElementById('show-answer').textContent=normalize(t.value)?'Check & show answer':'Show answer (ungraded)';}if(t.id==='search'){libraryQuery=t.value;renderEntries();}});
document.addEventListener('change',async event=>{const t=event.target;if(t.name==='topic'){db.settings.topics=[...document.querySelectorAll('input[name=topic]:checked')].map(x=>x.value);save();setupCount();}if(t.id==='review-only'){onlyReview=t.checked;setupCount();}if(t.id==='library-topic'){libraryTopic=t.value;renderEntries();}if(t.id==='rate'||t.id==='voice'){db.settings[t.id]=t.value;save();}if(t.id==='import-file'){const file=t.files[0];if(!file)return;if(file.size>200000){toast('That file is too large for a history backup.');return;}try{const raw=JSON.parse(await file.text());if(raw.app!==STORE||raw.data?.schema!==1)throw Error('format');const restored=validate(raw.data);confirm('Restore history backup?','This replaces this browser’s history progress with the selected backup. Spanish progress is not affected.',()=>{db=restored;save();home();toast('History backup restored.');},'Restore history');}catch(_){toast('This is not a valid History Studio backup. Nothing was changed.');}}});
modal.addEventListener('cancel',()=>{confirmFn=null;stopSpeech();setTimeout(()=>{if(view==='practice')audioControls();},0);});
window.addEventListener('pagehide',()=>{stopSpeech();save();});document.addEventListener('visibilitychange',()=>{if(document.hidden){stopSpeech();save();}else if(view==='practice'&&session()?.mode==='listen')audioControls();});
try{window.speechSynthesis?.addEventListener('voiceschanged',voiceOptions);}catch(_){}
document.getElementById('settings').innerHTML=icon('settings');document.getElementById('words').innerHTML=icon('book');document.getElementById('version').textContent='History v'+VERSION;
// The narrow history worker has a distinct cache prefix and never deletes Spanish caches.
if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).catch(()=>{});
if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.getRegistration('../').then(r=>{if(r&&new URL(r.scope).pathname===new URL('../',location.href).pathname)r.update().catch(()=>{});}).catch(()=>{});}
rememberBadges();home();
})();
</script></body></html>
