<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#193f3b">
  <meta name="description" content="Study all 20 Empires vocabulary terms with illustrated worksheet entries, flashcards, and history quizzes.">
  <title>Empires Vocabulary · History Studio</title>
  <link rel="icon" href="../icon-192.png">
  <link rel="apple-touch-icon" href="../icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script defer src="core.js"></script>
  <script defer src="terms.js"></script>
  <script defer src="practice.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to study area</a>
  <header class="topbar">
    <div class="top-inner">
      <a href="#overview" class="brand" aria-label="History Studio, Empires overview"><span class="brand-icon" data-icon="book"></span><span>History Studio</span></a>
      <nav aria-label="Empires unit">
        <a href="#overview" data-nav="overview">Overview</a>
        <a href="#vocabulary" data-nav="vocabulary">Word list</a>
        <a href="#review" data-nav="review">My review <span id="review-nav-count"></span></a>
      </nav>
      <button id="sound" class="sound" aria-label="Turn quiz sounds off" title="Quiz feedback sound" aria-pressed="true"><span data-icon="sound"></span><span class="sound-label">Sound on</span></button>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <p id="storage-note" class="storage" role="status" hidden>Your browser couldn’t save this session. You can keep studying while this tab is open.</p>
    <div id="overview-view"></div>
    <div id="library-view" hidden></div>
    <div id="review-view" hidden></div>
    <div id="practice-view" class="panel" hidden></div>
  </main>
  <footer><div><span class="foot-brand">History Studio</span><span class="dot">·</span> Empires Vocabulary</div><a href="../">Global Tapestry unit</a></footer>
  <div id="status" class="sr" role="status" aria-live="polite"></div>
  <noscript><p>Please enable JavaScript to open the vocabulary and practice activities.</p></noscript>
</body>
</html>
